<!doctype html>
<html lang="ru" data-lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NextClient — клиент Counter-Strike 1.6</title>
  <meta name="description" content="NextClient — модификация Counter-Strike 1.6 на базе Steam-версии 8684 для Windows и Linux: расширенный радар, защита от вредоносных команд, интеграция с Discord, расширенные настройки и API для серверов.">
  <meta property="og:title" content="NextClient">
  <meta property="og:description" content="A modern Counter-Strike 1.6 client for Windows and Linux, built on the Steam version 8684.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kotyarakryt.github.io/NextClient/">
  <meta property="og:image" content="https://kotyarakryt.github.io/NextClient/assets/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    (function () {
      var lang = null;
      try { lang = localStorage.getItem('lang'); } catch (e) {}
      // Russian for anyone who reads it: a Russian-speaking language anywhere in the browser's list,
      // or a CIS time zone, where an English browser still usually means a Russian-speaking player
      if (lang !== 'ru' && lang !== 'en') {
        var languages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
        var speaks = languages.some(function (l) { return /^(ru|uk|be|kk)\b/i.test(l); });
        // the first Intl call loads the time zone data and holds the page up on a phone,
        // so it is made only when the languages do not settle it
        var zone = '';
        if (!speaks) {
          try { zone = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
        }
        var cis = /^(Europe\/(Moscow|Kaliningrad|Samara|Ulyanovsk|Saratov|Volgograd|Astrakhan|Kirov|Simferopol|Kiev|Kyiv|Minsk|Chisinau)|Asia\/(Yekaterinburg|Omsk|Novosibirsk|Barnaul|Tomsk|Novokuznetsk|Krasnoyarsk|Irkutsk|Chita|Yakutsk|Khandyga|Vladivostok|Ust-Nera|Magadan|Sakhalin|Srednekolymsk|Kamchatka|Anadyr|Almaty|Qostanay|Qyzylorda|Aqtobe|Aqtau|Atyrau|Oral|Bishkek|Tashkent|Samarkand|Dushanbe|Ashgabat|Baku|Yerevan|Tbilisi))$/.test(zone);
        lang = speaks || cis ? 'ru' : 'en';
      }
      document.documentElement.setAttribute('data-lang', lang);
      document.documentElement.lang = lang;
      // the Cyrillic Inter is of use only to the Russian page, so only that page preloads it
      if (lang === 'ru') {
        var font = document.createElement('link');
        font.rel = 'preload';
        font.as = 'font';
        font.type = 'font/woff2';
        font.crossOrigin = '';
        font.href = 'assets/fonts/inter-cyrillic.woff2';
        document.head.appendChild(font);
      }
    })();
  </script>
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://api.github.com" crossorigin>
</head>
<body>
  <header class="top">
    <a class="brand" href="#top" aria-label="NextClient">
      <img src="assets/logo.svg" alt="" width="34" height="34">
      <span>NextClient</span>
    </a>
    <nav class="links">
      <a href="#tour">{{ nav.tour }}</a>
      <a href="#features">{{ nav.features }}</a>
      <a href="#install">{{ nav.install }}</a>
      <a href="#faq">FAQ</a>
      <a href="#changelog">{{ nav.changelog }}</a>
    </nav>
    <div class="actions">
      <a class="btn btn-primary btn-small header-cta" data-download href="https://github.com/CS-NextClient/NextClient/releases/latest">{{ nav.download }}</a>
      <button class="lang-switch" type="button" id="lang-switch"><span lang="ru">EN</span><span lang="en">RU</span></button>
      <a class="icon-link" href="https://github.com/CS-NextClient/NextClient" target="_blank" rel="noopener" aria-label="GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.39-5.27 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>
      </a>
    </div>
  </header>

  <main>
{{> hero }}

{{> tour }}

{{> extras }}

{{> install }}

{{> faq }}

{{> changelog }}
  </main>

  <footer class="bottom">
    <div class="bottom-brand">
      <img src="assets/logo.svg" alt="" width="26" height="26">
      <span>NextClient</span>
    </div>
    <nav class="bottom-links">
      <a href="https://github.com/CS-NextClient/NextClient" target="_blank" rel="noopener">GitHub</a>
      <a href="https://github.com/CS-NextClient/NextClient/releases" target="_blank" rel="noopener">{{ footer.releases }}</a>
      <a href="https://github.com/CS-NextClient/NextClientServerApi" target="_blank" rel="noopener">Server API</a>
      <a href="https://github.com/CS-NextClient/NextClient/issues" target="_blank" rel="noopener">{{ footer.report }}</a>
    </nav>
    <p class="disclaimer">{{ footer.disclaimer }}</p>
  </footer>

  <dialog class="lightbox" id="lightbox">
    <div class="lightbox-stage" id="lightbox-stage"></div>
    <p class="lightbox-caption"></p>
    <button class="lightbox-close" type="button" aria-label="Close">×</button>
    <button class="lightbox-prev" type="button" aria-label="Previous">‹</button>
    <button class="lightbox-next" type="button" aria-label="Next">›</button>
  </dialog>

  {{ modules }}
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
