[tour.radar]
title.ru = '''Радар'''
title.en = '''Radar'''
text.ru = '''Карта уровня строится сама, плоская или с текстурами, а слой выбирается по высоте, на которой вы стоите. Ники, здоровье союзников (если его передаёт сервер), следы движения и цели, а при открытой таблице счёта видна вся карта.'''
text.en = '''The level map builds itself, flat or textured, and the layer follows the height you stand at. Names, teammates' health (when the server sends it), movement trails and objectives, and the whole map while the scoreboard is open.'''
in_game.ru = '''В игре'''
in_game.en = '''In game'''
whole_map.ru = '''Вся карта'''
whole_map.en = '''Whole map'''

[tour.discord]
text.ru = '''В статусе Discord видно, на каком сервере вы играете и сколько там игроков, а ещё когда вы подключаетесь или смотрите демо. Друзья заходят к вам через Discord, даже если игра у них ещё не запущена. Статус, имя сервера и вход к вам выключаются кварами <code>cl_discordrpc</code>, <code>cl_discordrpc_server</code> и <code>cl_discordrpc_join</code>.'''
text.en = '''Your Discord status shows the server you play on and how many are there, and when you're connecting or watching a demo. Friends join you through Discord, even when their game isn't running yet. The status, the server's name and joining you turn off with <code>cl_discordrpc</code>, <code>cl_discordrpc_server</code> and <code>cl_discordrpc_join</code>.'''
