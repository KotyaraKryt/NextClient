[tour.tuning]
title.ru = '''Тонкая настройка'''
title.en = '''Fine tuning'''
text.ru = '''Модель оружия, боббинг, инерция и камера настраиваются по отдельности: смещение и FOV модели, стиль покачивания с живым превью, пресеты от классики до CS:GO для быстрого старта, а своими настройками можно поделиться одним кодом. Многое здесь взято из <a href="https://github.com/mikkokko/csldr" target="_blank" rel="noopener">csldr</a>.'''
