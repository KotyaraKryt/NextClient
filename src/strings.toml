title.ru = '''Установка'''
title.en = '''Installation'''
warning.ru = '''Никогда не кладите файлы NextClient в папку игры внутри Steam: это приведёт к VAC-бану. Пиратские сборки не поддерживаются.'''
warning.en = '''Never put the NextClient files into the game folder inside Steam: it leads to a VAC ban. Pirated copies are not supported.'''

[install.windows]
beta.ru = '''В Steam переключите CS&nbsp;1.6 на бету <b>steam_legacy</b>: NextClient работает с движком 8684.'''
beta.en = '''In Steam, switch CS&nbsp;1.6 to the <b>steam_legacy</b> beta: NextClient works with engine 8684.'''
copy.ru = '''Скопируйте папку Half-Life куда-нибудь вне папки Steam.'''
copy.en = '''Copy the Half-Life folder somewhere outside the Steam folder.'''
unpack.ru = '''Распакуйте в эту копию архив NextClient.'''
unpack.en = '''Unpack the NextClient archive into that copy.'''
start.ru = '''Запустите Steam, затем <code>cstrike.exe</code> из копии.'''
start.en = '''Start Steam, then <code>cstrike.exe</code> from the copy.'''

