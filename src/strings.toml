[extras.protector]
title.ru = '''Протектор'''
title.en = '''Protector'''
text.ru = '''Не даёт серверу выполнить на клиенте вредные команды и испортить конфиг.'''
text.en = '''Stops servers from running harmful commands on the client and breaking its config.'''

[extras.downloads]
title.ru = '''Быстрые загрузки'''
title.en = '''Fast downloads'''
text.ru = '''При входе на сервер видно, сколько файлов осталось, их размер и скорость. FastDL не открывает новое соединение на каждый файл.'''
text.en = '''On connect you see how many files are left, their size and the speed. FastDL doesn't open a new connection for every file.'''

[extras.screen]
title.ru = '''Экран и прицел'''
title.en = '''Screen and crosshair'''
text.ru = '''Правильный FOV на 16:9 и отдельный FOV для модели оружия. Новые прицелы: точка, T-образный и круг.'''
text.en = '''The proper FOV on 16:9 and a separate FOV for the weapon model. New crosshairs: a dot, a T shape and a circle.'''

[extras.interface]
title.ru = '''Интерфейс'''
title.en = '''Interface'''
text.ru = '''Две схемы оформления, свои добавляются рядом со старыми. HTML-интерфейс на Windows, цветной чат в консоли.'''
text.en = '''Two GUI schemes, and your own sit next to the old ones. An HTML interface on Windows, colored chat in the console.'''

[extras.servers]
title.ru = '''Для серверов'''
