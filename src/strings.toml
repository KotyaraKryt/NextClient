[faq]
title.ru = '''Частые вопросы'''
title.en = '''FAQ'''

[faq.vac]
question.ru = '''Не будет ли VAC-бана?'''
question.en = '''Will I get a VAC ban?'''
answer.ru = '''Играйте из копии игры вне папки Steam, как в разделе <a href="#install">Установка</a>. Класть файлы NextClient в папку игры внутри Steam нельзя: именно это приводит к VAC-бану.'''
answer.en = '''Play from a copy of the game outside the Steam folder, as in <a href="#install">Installation</a>. Never put the NextClient files into the game folder inside Steam: that is what leads to a VAC ban.'''

[faq.pirated]
question.ru = '''Работает ли на пиратской версии?'''
question.en = '''Does it work with a pirated copy?'''
answer.ru = '''Нет. Нужна купленная CS&nbsp;1.6 в Steam на бете <b>steam_legacy</b> и запущенный Steam. Эмулятора Steam в NextClient нет.'''
answer.en = '''No. You need a purchased CS&nbsp;1.6 on Steam on the <b>steam_legacy</b> beta, with Steam running. NextClient has no Steam emulator.'''

[faq.antivirus]
question.ru = '''Почему антивирус ругается?'''
question.en = '''Why does my antivirus complain?'''
answer.ru = '''NextClient перехватывает функции движка прямо в памяти, и некоторые антивирусы по эвристике принимают это за вредоносное поведение. С версии 2.5.1 официальные сборки собирает GitHub Actions из исходников этого репозитория и подписывает их происхождение. Проверить архив можно командой <code>gh attestation verify NextClient-&lt;версия&gt;.zip -R CS-NextClient/NextClient</code> или сверив его SHA-256 со страницей релиза. Как сообщить о ложном срабатывании, описано <a href="https://github.com/CS-NextClient/NextClient/blob/main/docs/reporting-av-false-positives.md" target="_blank" rel="noopener">здесь</a>.'''
answer.en = '''NextClient detours engine functions in memory, and some antivirus engines take that for malicious behavior by heuristics. Since 2.5.1, official builds are made by GitHub Actions from the source code of this repository and carry a signed provenance attestation. You can check an archive with <code>gh attestation verify NextClient-&lt;version&gt;.zip -R CS-NextClient/NextClient</code> or by comparing its SHA-256 with the release page. How to report a false positive is described <a href="https://github.com/CS-NextClient/NextClient/blob/main/docs/reporting-av-false-positives.md" target="_blank" rel="noopener">here</a>.'''

[faq.linux]
question.ru = '''Есть ли версия для Linux?'''
question.en = '''Is there a Linux version?'''
answer.ru = '''Да, начиная с 2.6.0. Это родная сборка, она запускается через Steam Runtime скриптом <code>nextclient.sh</code> и работает с обычной и Snap-версией Steam. Нужны 32-битные glibc 2.43 или новее, библиотеки C++ и SDL2, а для расширенного радара — OpenGL 2.1 с поддержкой FBO. Кнопка «Скачать» сама предложит её, если вы зашли с Linux. HTML-интерфейс на CEF пока есть только на Windows.'''
answer.en = '''Yes, since 2.6.0. It's a native build that runs through the Steam Runtime with the <code>nextclient.sh</code> script and works with the regular and the Snap Steam. It needs 32-bit glibc 2.43 or later, the C++ libraries and SDL2, and OpenGL 2.1 with framebuffer objects for the advanced radar. The Download button offers it by itself when you visit from Linux. The CEF-based HTML interface is Windows only for now.'''

[faq.back]
question.ru = '''Как вернуться к обычной CS?'''
question.en = '''How do I go back to the regular CS?'''
answer.ru = '''NextClient живёт в отдельной копии игры, а версия в Steam остаётся нетронутой: просто запустите игру из Steam. Чтобы удалить NextClient, удалите папку с копией.'''
answer.en = '''NextClient lives in a separate copy of the game and the Steam one stays untouched: just start the game from Steam. To remove NextClient, delete the folder with the copy.'''

[faq.server]
question.ru = '''Нужно ли что-то ставить на сервер?'''
question.en = '''Does the server need anything?'''
answer.ru = '''Нет, NextClient играет на любых серверах. Модуль <a href="https://github.com/CS-NextClient/NextClientServerApi" target="_blank" rel="noopener">NextClientServerApi</a> нужен, только если сервер хочет пользоваться возможностями NextClient: песочницей кваров, спрайтами, килфидом и остальным.'''
answer.en = '''No, NextClient plays on any server. The <a href="https://github.com/CS-NextClient/NextClientServerApi" target="_blank" rel="noopener">NextClientServerApi</a> module is only for servers that want NextClient's features: the cvar sandbox, sprites, the killfeed and the rest.'''

[faq.master]
question.ru = '''Как сменить мастер-сервер?'''
question.en = '''How do I change the master server?'''
answer.ru = '''В файле <code>platform/config/MasterServer.vdf</code>: <code>Selected</code> — номер сервера из списка <code>Servers</code>, считая с нуля. По умолчанию это <a href="https://tsarvar.com" target="_blank" rel="noopener">tsarvar.com</a>.'''
answer.en = '''In <code>platform/config/MasterServer.vdf</code>: <code>Selected</code> is the number of a server from the <code>Servers</code> list, counting from zero. The default is <a href="https://tsarvar.com" target="_blank" rel="noopener">tsarvar.com</a>.'''

