[hero]
title.ru = '''Доработанный клиент <em>CS&nbsp;1.6</em>'''
title.en = '''An improved <em>CS&nbsp;1.6</em> client'''
lead.ru = '''Ставится в копию Steam-версии игры на Windows и Linux. Добавляет радар с картой уровня, защиту от вредных команд сервера, статус в Discord, быстрые загрузки и настройку модели оружия, а движок остаётся оригинальным.'''
lead.en = '''It goes into a copy of the Steam version of the game, on Windows and Linux, and adds a radar with the level map, protection from harmful server commands, a Discord status, fast downloads and weapon model tuning, while the engine stays the original.'''
